[package]
name = "utilify-cli"
description = "utilifyctl: read and drive the running Utilify app from the terminal"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "utilifyctl"
path = "src/main.rs"

[dependencies]
utilify-core = { path = "../utilify-core" }
clap = { version = "4.5", features = ["derive", "wrap_help"] }
serde = "1"
serde_json = "1"
libc = "0.2"
unicode-width = "0.2"
